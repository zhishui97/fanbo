<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG图标</title>
    <script src="../font/iconfont.js"></script>
<link rel="stylesheet" href="./svg.css">
</head>
<body>
    <h3>SVG图标</h3>

    <div class="tab-nav">
        <div class="tab-item active" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true"><use href="#icon-biaoqing"></use></svg>
            <span>首页</span>
            <div class="badge-dot" id="badge-home"></div>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true"><use href="#icon-tiaojie"></use></svg>
            <span>收藏</span>
            <div class="badge-num" id="badge-collect">6</div>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true"><use href="#icon-dianzan"></use></svg>
            <span>购物车</span>
            <div class="badge-num" id="badge-cart"></div>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true"><use href="#icon-pengyouquan"></use></svg>
            <span>我的</span>
            <div class="badge-dot max" id="badge-my">100+</div>
        </div>
    </div>
    <script>
        // 写一个函数，当我点击当前的item时候，颜色发生变化
        function changeTab(current){
            let tabs=document.querySelectorAll('.tab-item');
            for(let i=0;i<tabs.length;i++){
                tabs[i].classList.remove('active');
            }
        //2.给当前点击的加上active高亮
        current.classList.add('active');
        }
    </script>
</body>
</html>
