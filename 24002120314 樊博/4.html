<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        //math对象
        console.log(Math.floor(8.9));//向下取整
        console.log(Math.round(8.7));//四舍五入
        console.log(Math.random());//随机数[0,1)]
        function getRandom(min,max){
            return Math.floor(Math.random()*(max-min+1));
        }
        console.log(getRandom(100,900));//获取100到900之间的随机整数
//date对象
        var date = new Date();
        console.log(date);
        console.log(date.getFullYear());//获取年份
        console.log(date.getMonth());//获取月份，0-11
        console.log(date.getDate());//获取日期，1-31
        console.log(date.getDay());//获取星期几，0-6
        console.log(date.getHours()+":"+date.getMinutes()+":"+date.getSeconds());//获取小时，0-23
        console.log(date.getMinutes());//获取分钟，0-59
        console.log(date.getSeconds());//获取秒数，0-59
        console.log(date.getMilliseconds());//获取毫秒数，0-999
        console.log(date.getTime());//获取时间戳，距离1970年1月1日的毫秒数

        //数组对象
        var arr = [1,2,3,4,5,'five','six','seven'];
        var arr1 = new Array(1,2,3,4,5,'five','six','seven');
        console.log(arr);
        console.log(arr1);
        console.log(new Array(5));//获取数组长度
    </script>
</body>
</html>
